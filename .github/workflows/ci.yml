name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Only the free discovery deps + pytest are needed for the unit tests;
        # the agent/Bedrock stack is not required to run them.
        run: |
          python -m pip install --upgrade pip
          pip install dnspython httpx cryptography pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Byte-compile all modules
        run: python -m compileall easm run_local.py schedule_scan.py
