[project]
name = "easm-agentcore"
version = "0.1.0"
description = "Cheap External Attack Surface Management tool using Bedrock AgentCore and passive discovery"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore>=0.1.0",
    "strands-agents>=0.1.0",
    "dnspython>=2.6.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
enrich = [
    "shodan>=1.31.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["easm*"]
